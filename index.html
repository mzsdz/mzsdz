  <script>
    const Cuisine = window.CuisineTaxonomy;
    const GENERIC_CUISINE = Cuisine?.GENERIC || new Set(["음식점", "일반", "기타"]);

    const METRO_SIDOS = new Set(["서울", "부산", "대구", "인천", "광주", "대전", "울산", "세종"]);
    const KNOWN_SIDOS = new Set([
      "서울", "부산", "대구", "인천", "광주", "대전", "울산", "세종",
      "경기", "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주",
    ]);
    /** 도(경기) 아래 시 이름인데, 광역시 시도와 철자가 같은 경우 */
    const CITY_SIDO_HOMONYMS = new Set(["광주"]); // 경기 광주 ↔ 광주광역시

    /** UI 표시용 (내부 키는 기존대로 광주 유지) */
    function displaySidoLabel(sido) {
      if (sido === "광주") return "광주광역시";
      return sido;
    }
    function displayCityLabel(sido, city) {
      if (sido === "경기" && city === "광주") return "광주시";
      return city;
    }
    function displayRegionChipLabel(label, level) {
      if (level === "sido") return displaySidoLabel(label);
      if (level === "city") return displayCityLabel(state.regionPath.sido, label);
      return label;
    }

    /** 법정동(용산동2가 등) → 행정구 복원용 */
    const DISTRICT_SIDO = {
      종로구: "서울", 중구: "서울", 용산구: "서울", 성동구: "서울", 광진구: "서울",
      동대문구: "서울", 중랑구: "서울", 성북구: "서울", 강북구: "서울", 도봉구: "서울",
      노원구: "서울", 은평구: "서울", 서대문구: "서울", 마포구: "서울", 양천구: "서울",
      강서구: "서울", 구로구: "서울", 금천구: "서울", 영등포구: "서울", 동작구: "서울",
      관악구: "서울", 서초구: "서울", 강남구: "서울", 송파구: "서울", 강동구: "서울",
      해운대구: "부산", 수영구: "부산", 부산진구: "부산", 동래구: "부산", 남구: "부산",
      북구: "부산", 사상구: "부산", 사하구: "부산", 금정구: "부산", 연제구: "부산",
      수성구: "대구", 달서구: "대구",
      연수구: "인천", 남동구: "인천", 부평구: "인천", 계양구: "인천", 미추홀구: "인천",
      서구: "인천", 동구: "인천",
    };

    function normalizeSido(raw) {
      const s = (raw || "").trim();
      if (s.startsWith("서울")) return "서울";
      if (s.startsWith("부산")) return "부산";
      if (s.startsWith("대구")) return "대구";
      if (s.startsWith("인천")) return "인천";
      if (s.startsWith("광주")) return "광주";
      if (s.startsWith("대전")) return "대전";
      if (s.startsWith("울산")) return "울산";
      if (s.startsWith("세종")) return "세종";
      if (s.startsWith("경기")) return "경기";
      if (s.startsWith("강원")) return "강원";
      if (s.startsWith("충북") || s.startsWith("충청북")) return "충북";
      if (s.startsWith("충남") || s.startsWith("충청남")) return "충남";
      if (s.startsWith("전북") || s.startsWith("전라북")) return "전북";
      if (s.startsWith("전남") || s.startsWith("전라남")) return "전남";
      if (s.startsWith("경북") || s.startsWith("경상북")) return "경북";
      if (s.startsWith("경남") || s.startsWith("경상남")) return "경남";
      if (s.startsWith("제주")) return "제주";
      return s
        .replace(/특별자치도$/, "")
        .replace(/특별시$/, "")
        .replace(/광역시$/, "")
        .replace(/특별자치시$/, "")
        .replace(/도$/, "");
    }

    function isLegalDongToken(token) {
      const t = String(token || "").trim();
      return /동\d*가$/.test(t) || /[가-힣]+동$/.test(t);
    }

    /** 용산동2가 → { sido: 서울, district: 용산구 } */
    function regionFromLegalDong(token) {
      const t = String(token || "").trim();
      const m = t.match(/^(.+?)동\d*가$/);
      if (!m) return null;
      const district = `${m[1]}구`;
      const sido = DISTRICT_SIDO[district];
      if (!sido) return null;
      return { sido, city: null, district };
    }

    /** @returns {{ sido: string|null, city: string|null, district: string|null }} */
    function parseRegionPath(address) {
      const parts = String(address || "").trim().split(/\s+/).filter(Boolean);
      const first = parts[0] || "";
      const second = parts[1] || "";
      const third = parts[2] || "";

      // Incomplete jibun-only address: "용산동2가 1-206 …"
      const fromDong = regionFromLegalDong(first);
      if (fromDong) return fromDong;

      const sidoRaw = normalizeSido(first);
      if (!KNOWN_SIDOS.has(sidoRaw)) {
        // Don't treat 법정동/잡토큰 as a region tag (e.g. 관양동).
        return { sido: null, city: null, district: null };
      }
      const sido = sidoRaw;
      let city = null;
      let district = null;

      if (METRO_SIDOS.has(sido)) {
        if (/구$/.test(second) && !isLegalDongToken(second)) district = second;
      } else if (/시$|군$/.test(second)) {
        city = second.replace(/(시|군)$/, "");
        if (/구$/.test(third) && !isLegalDongToken(third)) district = third;
      } else if (/구$/.test(second) && !isLegalDongToken(second)) {
        district = second;
      }

      return { sido, city, district };
    }

    function regionLabels(path) {
      const labels = [];
      const push = (l) => {
        const v = String(l || "").trim();
        if (!v) return;
        if (labels.some((x) => x.toLowerCase() === v.toLowerCase())) return;
        labels.push(v);
      };
      push(path?.sido);
      // Avoid 대구+대구 when city was wrongly filled with the same sido name.
      if (path?.city && path.city !== path.sido) push(path.city);
      if (path?.district && path.district !== path.sido && path.district !== path.city) {
        push(path.district);
      }
      return labels;
    }

    function emptyRegionPath() {
      return { sido: null, city: null, district: null };
    }

    function normTagKey(label) {
      return String(label || "")
        .trim()
        .normalize("NFC")
        .toLowerCase();
    }

    function dedupeTagViews(views) {
      const map = new Map();
      for (const v of views || []) {
        const key = normTagKey(v?.label);
        if (!key) continue;
        const prev = map.get(key);
        // Prefer the one that exists in DB (has tagId).
        if (!prev || (!prev.tagId && v.tagId)) map.set(key, v);
      }
      return [...map.values()];
    }

    /** Build hierarchy from flat region tag labels (DB). */
    function deriveRegionPath(labels) {
      const list = [
        ...new Set(
          (labels || [])
            .map((l) => String(l || "").trim())
            .filter((l) => l && !isLegalDongToken(l))
        ),
      ];
      // Prefer province (경기) over metro homonym (광주) when both appear.
      const province = list.find((l) => KNOWN_SIDOS.has(l) && !METRO_SIDOS.has(l)) || null;
      const sido =
        province ||
        list.find((l) => KNOWN_SIDOS.has(l)) ||
        null;
      const district = list.find((l) => /구$/.test(l) && !isLegalDongToken(l)) || null;
      let city = null;
      if (sido && !METRO_SIDOS.has(sido)) {
        city =
          list.find((l) => {
            if (!l || l === sido || l === district || /구$/.test(l)) return false;
            if (KNOWN_SIDOS.has(l)) {
              // 경기 + 광주 → city 광주 (not 광주광역시)
              return CITY_SIDO_HOMONYMS.has(l);
            }
            return true;
          }) || null;
      }
      if (city && city === sido) city = null;
      return { sido, city, district };
    }

    function regionExtras(labels, path) {
      const used = new Set(
        [path?.sido, path?.city, path?.district].filter(Boolean).map((l) => normTagKey(l))
      );
      return (labels || []).filter(
        (l) => l && !used.has(normTagKey(l)) && !isLegalDongToken(l)
      );
    }

    /** Resolve 광주 모호성: 주소가 있으면 태그의 광주/경기 충돌보다 주소를 우선 */
    function disambiguateRegionPath(path, addr) {
      const p = path || emptyRegionPath();
      const a = addr || emptyRegionPath();
      if (a.sido === "경기" && a.city === "광주") {
        return {
          sido: "경기",
          city: "광주",
          district: p.district || a.district || null,
        };
      }
      if (a.sido === "광주") {
        return {
          sido: "광주",
          city: null,
          district: p.district || a.district || null,
        };
      }
      return {
        sido: p.sido || a.sido || null,
        city: p.city || a.city || null,
        district: p.district || a.district || null,
      };
    }

    function parseCuisine(category, name) {
      const hit = Cuisine?.classify?.(category, name) || {
        major: null,
        minor: null,
        labels: [],
      };
      return hit;
    }

    function starLabel(n) {
      if (n >= 3) return "★★★";
      if (n === 2) return "★★";
      if (n === 1) return "★";
      return "맛집 후보";
    }

    function emptyCuisinePath() {
      return Cuisine?.emptyCuisinePath?.() || { major: null, minor: null };
    }

    function enrich(place, index) {
      const rawStars = Number(place.stars);
      const stars = Number.isFinite(rawStars) ? rawStars : 1;
      const classified = parseCuisine(place.category, place.name);
      const baseCuisine = classified.labels || [];
      const baseCuisinePath = {
        major: classified.major || null,
        minor: classified.minor || null,
      };
      const addressRegionPath = parseRegionPath(place.address);
      const addressRegionLabels = regionLabels(addressRegionPath);
      const tags = [
        ...baseCuisine.map((t) => ({ type: "cuisine", label: t })),
        ...addressRegionLabels.map((t) => ({ type: "region", label: t })),
      ];
      const baseSearchText = [
        place.name,
        place.category,
        place.address,
        place.list || "",
        ...baseCuisine,
        ...addressRegionLabels,
      ]
        .join(" ")
        .toLowerCase();
      const searchText = `${baseSearchText} ${starLabel(stars)}`.toLowerCase();
      const query = encodeURIComponent(`${place.name} ${place.address.split(" ").slice(0, 3).join(" ")}`);
      const naverUrl = place.sid
        ? `https://map.naver.com/p/entry/place/${place.sid}`
        : `https://map.naver.com/v5/search/${query}`;
      return {
        ...place,
        stars,
        baseStars: stars,
        id: index,
        baseCuisine,
        baseCuisinePath,
        cuisine: [...baseCuisine],
        cuisineSet: new Set(baseCuisine),
        cuisinePath: { ...baseCuisinePath },
        cuisineTags: baseCuisine.map((label) => ({ type: "cuisine", label })),
        customTags: [],
        addressRegionPath,
        addressRegionLabels,
        regionPath: { ...addressRegionPath },
        region: [...addressRegionLabels],
        regionTags: addressRegionLabels.map((label) => ({ type: "region", label })),
        extraRegions: [],
        extraCuisines: [],
        tags,
        searchText,
        baseSearchText,
        naverUrl,
      };
    }

    const staticPlaces = (window.PLACES || []).map(enrich)
      .sort((a, b) => b.stars - a.stars || a.name.localeCompare(b.name, "ko"));
    /** @type {typeof staticPlaces} */
    let allPlaces = staticPlaces.slice();
    /** @type {typeof allPlaces} */
    let places = allPlaces.slice();
    /** @type {Set<string>} */
    let hiddenSids = new Set();
    /** @type {Record<string, number>} */
    let starsBySid = {};
    /** @type {Array<Record<string, unknown>>} */
    let addedPlaceRows = [];

    const state = {
      q: "",
      stars: new Set(),
      regionPath: emptyRegionPath(),
      customRegion: null,
      cuisinePath: emptyCuisinePath(),
      customCuisine: null,
    };

    /** @type {Record<string, string>} */
    let memosBySid = {};
    /** @type {Record<string, Array<{ id: string, label: string, kind?: string }>>} */
    let tagsBySid = {};
    /** After admin seed, DB is the only source for that kind (so deletes stick). */
    let cuisineDbReady = false;
    let regionDbReady = false;

    const els = {
      totalCount: document.getElementById("totalCount"),
      star1Count: document.getElementById("star1Count"),
      star2Count: document.getElementById("star2Count"),
      star3Count: document.getElementById("star3Count"),
      star0Count: document.getElementById("star0Count"),
      shownCount: document.getElementById("shownCount"),
      activeFilters: document.getElementById("activeFilters"),
      starChips: document.getElementById("starChips"),
      regionNav: document.getElementById("regionNav"),
      regionChips: document.getElementById("regionChips"),
      cuisineNav: document.getElementById("cuisineNav"),
      cuisineChips: document.getElementById("cuisineChips"),
      grid: document.getElementById("grid"),
      empty: document.getElementById("empty"),
      scrollSentinel: document.getElementById("scrollSentinel"),
      q: document.getElementById("q"),
      resetBtn: document.getElementById("resetBtn"),
      homeBtn: document.getElementById("homeBtn"),
      addPlaceBtn: document.getElementById("addPlaceBtn"),
      addPlaceModal: document.getElementById("addPlaceModal"),
      addPlaceModalClose: document.getElementById("addPlaceModalClose"),
      addPlaceUrl: document.getElementById("addPlaceUrl"),
      addPlaceResolveBtn: document.getElementById("addPlaceResolveBtn"),
      addPlaceStatus: document.getElementById("addPlaceStatus"),
      addPlacePreview: document.getElementById("addPlacePreview"),
      addPlaceName: document.getElementById("addPlaceName"),
      addPlaceAddress: document.getElementById("addPlaceAddress"),
      addPlaceCategory: document.getElementById("addPlaceCategory"),
      addPlaceStars: document.getElementById("addPlaceStars"),
      addPlaceSid: document.getElementById("addPlaceSid"),
      addPlacePx: document.getElementById("addPlacePx"),
      addPlacePy: document.getElementById("addPlacePy"),
      addPlaceSourceUrl: document.getElementById("addPlaceSourceUrl"),
      addPlaceSaveBtn: document.getElementById("addPlaceSaveBtn"),
      selectModeBtn: document.getElementById("selectModeBtn"),
      selectAllBtn: document.getElementById("selectAllBtn"),
      selectVisibleBtn: document.getElementById("selectVisibleBtn"),
      bulkBar: document.getElementById("bulkBar"),
      bulkCount: document.getElementById("bulkCount"),
      bulkKind: document.getElementById("bulkKind"),
      bulkCuisineMajor: document.getElementById("bulkCuisineMajor"),
      bulkRegionSido: document.getElementById("bulkRegionSido"),
      bulkLabel: document.getElementById("bulkLabel"),
      bulkAddBtn: document.getElementById("bulkAddBtn"),
      bulkRemoveBtn: document.getElementById("bulkRemoveBtn"),
      bulkWipeBtn: document.getElementById("bulkWipeBtn"),
      bulkClearBtn: document.getElementById("bulkClearBtn"),
      bulkExitBtn: document.getElementById("bulkExitBtn"),
    };

    const PAGE_SIZE = 48;
    let visibleLimit = PAGE_SIZE;
    let filterKey = "";
    let renderQueued = false;
    let hasMore = false;
    let selectMode = false;
    let bulkKind = "cuisine";
    /** @type {Set<string>} */
    const selectedSids = new Set();
    /** @type {object[]} */
    let lastShownPlaces = [];
    /** @type {typeof places} */
    let lastFilteredPlaces = [];
    /** @type {Map<string, object>} */
    const placeBySid = new Map();

    function rebuildPlaceIndex() {
      placeBySid.clear();
      for (const p of places) {
        if (p.sid) placeBySid.set(String(p.sid), p);
      }
    }

    function computeStarStats() {
      return [
        ["★★★", places.filter((p) => p.stars === 3).length],
        ["★★", places.filter((p) => p.stars === 2).length],
        ["★", places.filter((p) => p.stars === 1).length],
        ["맛집 후보", places.filter((p) => p.stars === 0).length],
      ];
    }

    let starStats = computeStarStats();
    rebuildPlaceIndex();

    function applyHiddenPlaces(sids) {
      hiddenSids = new Set((sids || []).map(String));
      places = allPlaces.filter((p) => !p.sid || !hiddenSids.has(String(p.sid)));
      starStats = computeStarStats();
      rebuildPlaceIndex();
      for (const sid of [...selectedSids]) {
        if (hiddenSids.has(sid) || !placeBySid.has(sid)) selectedSids.delete(sid);
      }
    }

    function applyAddedPlaces(rows) {
      addedPlaceRows = rows || [];
      const existingSids = new Set(
        staticPlaces.map((p) => String(p.sid || "")).filter(Boolean)
      );
      const extras = [];
      for (const row of addedPlaceRows) {
        const sid = String(row.sid || row.place_sid || "").trim();
        if (!sid || existingSids.has(sid)) continue;
        existingSids.add(sid);
        extras.push(
          enrich(
            {
              name: row.name || "",
              address: row.address || "",
              category: row.category || "",
              stars: Number(row.stars) || 0,
              px: row.px,
              py: row.py,
              sid,
              list: row.list || "직접추가",
            },
            staticPlaces.length + extras.length
          )
        );
      }
      allPlaces = [...staticPlaces, ...extras].sort(
        (a, b) => b.stars - a.stars || a.name.localeCompare(b.name, "ko")
      );
      places = allPlaces.filter((p) => !p.sid || !hiddenSids.has(String(p.sid)));
      // Re-apply star overrides onto the rebuilt list
      if (Object.keys(starsBySid).length) {
        for (const place of allPlaces) {
          const sid = place.sid ? String(place.sid) : "";
          const override = sid ? starsBySid[sid] : undefined;
          if (Number.isFinite(override)) place.stars = Number(override);
        }
        allPlaces.sort((a, b) => b.stars - a.stars || a.name.localeCompare(b.name, "ko"));
        places = allPlaces.filter((p) => !p.sid || !hiddenSids.has(String(p.sid)));
      }
      starStats = computeStarStats();
      rebuildPlaceIndex();
      applyCustomTags();
    }

    function applyStarOverrides(map) {
      starsBySid = map || {};
      for (const place of allPlaces) {
        const sid = place.sid ? String(place.sid) : "";
        const override = sid ? starsBySid[sid] : undefined;
        place.stars = Number.isFinite(override) ? Number(override) : place.baseStars;
        place.searchText = [
          place.baseSearchText,
          starLabel(place.stars),
          ...(place.cuisine || []),
          ...(place.region || []),
        ]
          .join(" ")
          .toLowerCase();
      }
      allPlaces.sort((a, b) => b.stars - a.stars || a.name.localeCompare(b.name, "ko"));
      places = allPlaces.filter((p) => !p.sid || !hiddenSids.has(String(p.sid)));
      starStats = computeStarStats();
      rebuildPlaceIndex();
    }

    function countBy(getter, list = places) {
      const map = new Map();
      for (const p of list) {
        for (const tag of getter(p)) {
          map.set(tag, (map.get(tag) || 0) + 1);
        }
      }
      return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));
    }

    function matchesQuery(place) {
      if (!state.q) return true;
      const tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      const memo = (memosBySid[String(place.sid)] || "").toLowerCase();
      const hay = `${place.searchText} ${memo}`;
      return tokens.every((t) => hay.includes(t.replace(/^#/, "")));
    }

    function matchesStars(place) {
      if (!state.stars.size) return true;
      return (
        (state.stars.has("★★★") && place.stars === 3) ||
        (state.stars.has("★★") && place.stars === 2) ||
        (state.stars.has("★") && place.stars === 1) ||
        (state.stars.has("맛집 후보") && place.stars === 0)
      );
    }

    function matchesRegionFilter(place) {
      const rp = place.regionPath || emptyRegionPath();
      const sp = state.regionPath;
      if (state.customRegion) {
        return (place.extraRegions || []).includes(state.customRegion);
      }
      if (sp.sido && rp.sido !== sp.sido) return false;
      if (sp.city && rp.city !== sp.city) return false;
      if (sp.district && rp.district !== sp.district) return false;
      return true;
    }

    function matchesCuisine(place) {
      if (state.customCuisine) {
        return (place.extraCuisines || []).includes(state.customCuisine);
      }
      const cp = place.cuisinePath || emptyCuisinePath();
      const sp = state.cuisinePath;
      if (sp.major && cp.major !== sp.major) return false;
      if (sp.minor && cp.minor !== sp.minor) return false;
      return true;
    }

    /** Facet counts: apply other filters, skip the facet being counted. */
    function placesForFacet(exclude) {
      return places.filter((p) => {
        if (!matchesQuery(p)) return false;
        if (exclude !== "stars" && !matchesStars(p)) return false;
        if (exclude !== "region" && !matchesRegionFilter(p)) return false;
        if (exclude !== "cuisine" && !matchesCuisine(p)) return false;
        return true;
      });
    }

    function starChipStats() {
      const list = placesForFacet("stars");
      return [
        ["★★★", list.filter((p) => p.stars === 3).length],
        ["★★", list.filter((p) => p.stars === 2).length],
        ["★", list.filter((p) => p.stars === 1).length],
        ["맛집 후보", list.filter((p) => p.stars === 0).length],
      ];
    }

    function applyCustomTags() {
      const EMPTY = "__empty__";
      for (const place of allPlaces) {
        const custom = (tagsBySid[String(place.sid)] || []).filter((t) => t.label);
        const cuisineAll = custom.filter((t) => t.kind !== "region");
        const regionAll = custom.filter((t) => t.kind === "region");
        const cuisineCustom = cuisineAll.filter((t) => t.label !== EMPTY);
        const regionCustom = regionAll.filter(
          (t) => t.label !== EMPTY && !isLegalDongToken(t.label)
        );
        const cuisineCleared = cuisineAll.some((t) => t.label === EMPTY);
        const regionCleared = regionAll.some((t) => t.label === EMPTY);
        place.customTags = [...cuisineCustom, ...regionCustom];

        // Cuisine: DB is source of truth once seeded / present / explicitly cleared.
        if (cuisineDbReady || cuisineCustom.length > 0 || cuisineCleared) {
          const labels = cuisineCustom.map((t) => t.label);
          const path = Cuisine?.pathFromLabels?.(labels) || {
            major: null,
            minor: null,
            extras: labels,
          };
          const byLabel = new Map();
          for (const t of cuisineCustom) {
            const key = normTagKey(t.label);
            if (!key) continue;
            const prev = byLabel.get(key);
            if (!prev || (!prev.id && t.id)) byLabel.set(key, t);
          }
          const cuisineTagViews = [];
          const seen = new Set();
          const pushLabel = (label) => {
            const key = normTagKey(label);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const hit = byLabel.get(key);
            cuisineTagViews.push(
              hit
                ? { type: "cuisine", label: hit.label, tagId: hit.id }
                : { type: "cuisine", label: String(label).trim() }
            );
          };
          if (path.major) pushLabel(path.major);
          if (path.minor) pushLabel(path.minor);
          for (const t of cuisineCustom) {
            const key = normTagKey(t.label);
            if (!key || seen.has(key)) continue;
            seen.add(key);
            cuisineTagViews.push({ type: "cuisine", label: t.label, tagId: t.id });
          }
          place.cuisinePath = { major: path.major || null, minor: path.minor || null };
          place.cuisineTags = dedupeTagViews(cuisineTagViews);
          place.cuisine = place.cuisineTags.map((t) => t.label);
          place.cuisineSet = new Set(place.cuisine);
          place.extraCuisines = (path.extras || []).filter(
            (l) => l && l !== path.major && l !== path.minor
          );
        } else {
          place.cuisine = [...(place.baseCuisine || [])];
          place.cuisineSet = new Set(place.cuisine);
          place.cuisinePath = {
            major: place.baseCuisinePath?.major || null,
            minor: place.baseCuisinePath?.minor || null,
          };
          place.cuisineTags = (place.baseCuisine || []).map((label) => ({
            type: "cuisine",
            label,
          }));
          place.extraCuisines = [];
        }

        // Region: same rule.
        if (regionDbReady || regionCustom.length > 0 || regionCleared) {
          let path = deriveRegionPath(regionCustom.map((t) => t.label));
          const addr = place.addressRegionPath || emptyRegionPath();
          path = disambiguateRegionPath(path, addr);
          if (path.city && path.sido && path.city === path.sido) path.city = null;

          const byLabel = new Map();
          for (const t of regionCustom) {
            const key = normTagKey(t.label);
            if (!key) continue;
            const prev = byLabel.get(key);
            if (!prev || (!prev.id && t.id)) byLabel.set(key, t);
          }

          const regionTagViews = [];
          const seen = new Set();
          const pushLabel = (label, preferDb = true) => {
            const key = normTagKey(label);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const hit = byLabel.get(key);
            if (hit && preferDb) {
              regionTagViews.push({ type: "region", label: hit.label, tagId: hit.id });
            } else if (hit) {
              regionTagViews.push({ type: "region", label: hit.label, tagId: hit.id });
            } else {
              regionTagViews.push({ type: "region", label: String(label).trim() });
            }
          };

          for (const label of regionLabels(path)) pushLabel(label);
          for (const t of regionCustom) {
            const key = normTagKey(t.label);
            if (!key || seen.has(key)) continue;
            // Orphan district/city tags without hierarchy still show once.
            seen.add(key);
            regionTagViews.push({ type: "region", label: t.label, tagId: t.id });
          }

          place.regionPath = path;
          place.regionTags = dedupeTagViews(regionTagViews);
          place.region = place.regionTags.map((t) => t.label);
          place.extraRegions = regionExtras(place.region, path).filter(
            (l) => !/(구|시|군)$/.test(l)
          );
        } else {
          const allRegionLabels = [...(place.addressRegionLabels || [])];
          const addr = place.addressRegionPath || emptyRegionPath();
          place.regionPath = disambiguateRegionPath(
            deriveRegionPath(allRegionLabels),
            addr
          );
          place.regionTags = dedupeTagViews(
            allRegionLabels.map((label) => ({ type: "region", label }))
          );
          place.region = place.regionTags.map((t) => t.label);
          place.extraRegions = regionExtras(place.region, place.regionPath).filter(
            (l) => !/(구|시|군)$/.test(l)
          );
        }

        place.tags = [...place.cuisineTags, ...place.regionTags];
        place.searchText = [
          place.baseSearchText,
          starLabel(place.stars),
          ...place.cuisine,
          ...place.region,
        ]
          .join(" ")
          .toLowerCase();
      }
    }

    function cuisineStats() {
      return currentCuisineLevelStats();
    }

    function placesMatchingCuisine(path, list = places) {
      return list.filter((p) => {
        const cp = p.cuisinePath || emptyCuisinePath();
        if (path.major && cp.major !== path.major) return false;
        if (path.minor && cp.minor !== path.minor) return false;
        return true;
      });
    }

    function currentCuisineLevelStats() {
      const base = placesForFacet("cuisine");
      const majors = new Set(Cuisine?.MAJORS || []);
      if (!state.cuisinePath.major || state.customCuisine) {
        const majorStats = countField(base, (p) => p.cuisinePath?.major).filter(([k]) =>
          majors.has(k)
        );
        const customStats = countBy((p) => p.extraCuisines || [], base);
        const majorSet = new Set(majorStats.map(([k]) => k));
        const extras = customStats.filter(([k]) => !majorSet.has(k) && !majors.has(k));
        return [...majorStats, ...extras];
      }
      return countField(
        placesMatchingCuisine({ major: state.cuisinePath.major, minor: null }, base),
        (p) => p.cuisinePath?.minor
      ).filter(([k]) => k);
    }

    function placesMatchingRegion(path, list = places) {
      return list.filter((p) => {
        const rp = p.regionPath || emptyRegionPath();
        if (path.sido && rp.sido !== path.sido) return false;
        if (path.city && rp.city !== path.city) return false;
        if (path.district && rp.district !== path.district) return false;
        return true;
      });
    }

    function countField(list, getter) {
      const map = new Map();
      for (const p of list) {
        const key = getter(p);
        if (!key) continue;
        map.set(key, (map.get(key) || 0) + 1);
      }
      return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));
    }

    function isAdminAreaLabel(label) {
      const l = String(label || "").trim();
      if (!l) return false;
      if (KNOWN_SIDOS.has(l)) return true;
      return /(구|시|군)$/.test(l);
    }

    function currentRegionLevelStats() {
      const base = placesForFacet("region");
      const { sido, city, district } = state.regionPath;
      if (!sido || state.customRegion) {
        // Top level: only real 시도. Districts like 남구/중구 must not appear here.
        const sidoStats = countField(base, (p) => p.regionPath?.sido).filter(([k]) =>
          KNOWN_SIDOS.has(k)
        );
        const customStats = countBy((p) => p.extraRegions || [], base);
        const sidoSet = new Set(sidoStats.map(([k]) => k));
        const extras = customStats.filter(
          ([k]) => !sidoSet.has(k) && !isAdminAreaLabel(k)
        );
        return [...sidoStats, ...extras];
      }
      if (METRO_SIDOS.has(sido)) {
        return countField(
          placesMatchingRegion({ sido, city: null, district: null }, base),
          (p) => p.regionPath?.district
        );
      }
      if (!city) {
        return countField(
          placesMatchingRegion({ sido, city: null, district: null }, base),
          (p) => p.regionPath?.city
        );
      }
      return countField(
        placesMatchingRegion({ sido, city, district: null }, base),
        (p) => p.regionPath?.district
      );
    }

    function isSidoLabel(label) {
      return KNOWN_SIDOS.has(label);
    }

    function renderRegionNav() {
      if (!els.regionNav) return;
      els.regionNav.innerHTML = "";
      const { sido, city, district } = state.regionPath;
      if (!sido && !state.customRegion) return;

      const addCrumb = (label, onClick) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "region-crumb" + (onClick ? "" : " current");
        btn.textContent = label;
        if (onClick) btn.addEventListener("click", onClick);
        els.regionNav.appendChild(btn);
      };
      const addSep = () => {
        const sep = document.createElement("span");
        sep.className = "region-sep";
        sep.textContent = "›";
        els.regionNav.appendChild(sep);
      };

      addCrumb("전체", () => {
        state.regionPath = emptyRegionPath();
        state.customRegion = null;
        scheduleRender();
      });

      if (state.customRegion) {
        addSep();
        addCrumb(state.customRegion, null);
        return;
      }

      addSep();
      addCrumb(displaySidoLabel(sido), district || city ? () => {
        state.regionPath = { sido, city: null, district: null };
        state.customRegion = null;
        scheduleRender();
      } : null);

      if (city) {
        addSep();
        addCrumb(displayCityLabel(sido, city), district ? () => {
          state.regionPath = { sido, city, district: null };
          scheduleRender();
        } : null);
      }
      if (district) {
        addSep();
        addCrumb(district, null);
      }
    }

    function renderRegionChips() {
      renderRegionNav();
      const stats = currentRegionLevelStats();
      const { sido, city, district } = state.regionPath;
      let selected = null;
      if (state.customRegion) selected = state.customRegion;
      else if (sido && METRO_SIDOS.has(sido)) selected = district;
      else if (sido && city) selected = district;

      els.regionChips.innerHTML = "";
      let chipLevel = "district";
      if (!sido && !state.customRegion) chipLevel = "sido";
      else if (sido && !METRO_SIDOS.has(sido) && !city) chipLevel = "city";
      else if (sido && METRO_SIDOS.has(sido)) chipLevel = "district";

      for (const [label, count] of stats) {
        const btn = document.createElement("button");
        btn.type = "button";
        const on =
          state.customRegion === label ||
          selected === label;
        btn.className = "chip" + (on ? " on" : "");
        const shown = displayRegionChipLabel(label, chipLevel);
        btn.innerHTML = `${escapeHtml(shown)}<span class="count">${count}</span>`;
        btn.addEventListener("click", () => {
          if (state.customRegion || (!state.regionPath.sido && !state.customRegion)) {
            if (!isSidoLabel(label)) {
              state.customRegion = state.customRegion === label ? null : label;
              state.regionPath = emptyRegionPath();
            } else {
              state.customRegion = null;
              state.regionPath = { sido: label, city: null, district: null };
            }
          } else if (METRO_SIDOS.has(state.regionPath.sido)) {
            state.regionPath = {
              sido: state.regionPath.sido,
              city: null,
              district: state.regionPath.district === label ? null : label,
            };
          } else if (!state.regionPath.city) {
            state.regionPath = {
              sido: state.regionPath.sido,
              city: label,
              district: null,
            };
          } else {
            state.regionPath = {
              sido: state.regionPath.sido,
              city: state.regionPath.city,
              district: state.regionPath.district === label ? null : label,
            };
          }
          scheduleRender();
        });
        els.regionChips.appendChild(btn);
      }
    }

    function isCuisineMajorLabel(label) {
      return (Cuisine?.MAJORS || []).includes(label);
    }

    function renderCuisineNav() {
      if (!els.cuisineNav) return;
      els.cuisineNav.innerHTML = "";
      const { major, minor } = state.cuisinePath;
      if (!major && !state.customCuisine) return;

      const addCrumb = (label, onClick) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "region-crumb" + (onClick ? "" : " current");
        btn.textContent = label;
        if (onClick) btn.addEventListener("click", onClick);
        els.cuisineNav.appendChild(btn);
      };
      const addSep = () => {
        const sep = document.createElement("span");
        sep.className = "region-sep";
        sep.textContent = "›";
        els.cuisineNav.appendChild(sep);
      };

      addCrumb("전체", () => {
        state.cuisinePath = emptyCuisinePath();
        state.customCuisine = null;
        scheduleRender();
      });

      if (state.customCuisine) {
        addSep();
        addCrumb(state.customCuisine, null);
        return;
      }

      addSep();
      addCrumb(major, minor
        ? () => {
            state.cuisinePath = { major, minor: null };
            state.customCuisine = null;
            scheduleRender();
          }
        : null);

      if (minor) {
        addSep();
        addCrumb(minor, null);
      }
    }

    function renderCuisineChips() {
      renderCuisineNav();
      const stats = currentCuisineLevelStats();

      els.cuisineChips.innerHTML = "";
      for (const [label, count] of stats) {
        const btn = document.createElement("button");
        btn.type = "button";
        const on =
          state.customCuisine === label ||
          state.cuisinePath.minor === label ||
          (!state.cuisinePath.minor &&
            !state.customCuisine &&
            state.cuisinePath.major === label);
        btn.className = "chip" + (on ? " on" : "");
        btn.innerHTML = `${escapeHtml(label)}<span class="count">${count}</span>`;
        btn.addEventListener("click", () => {
          if (state.customCuisine || (!state.cuisinePath.major && !state.customCuisine)) {
            if (!isCuisineMajorLabel(label)) {
              state.customCuisine = state.customCuisine === label ? null : label;
              state.cuisinePath = emptyCuisinePath();
            } else {
              state.customCuisine = null;
              state.cuisinePath = {
                major: state.cuisinePath.major === label ? null : label,
                minor: null,
              };
            }
          } else {
            state.customCuisine = null;
            state.cuisinePath = {
              major: state.cuisinePath.major,
              minor: state.cuisinePath.minor === label ? null : label,
            };
          }
          scheduleRender();
        });
        els.cuisineChips.appendChild(btn);
      }
    }

    function renderChips(container, stats, selected, { exclusive = false } = {}) {
      container.innerHTML = "";
      for (const [label, count] of stats) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (selected.has(label) ? " on" : "");
        btn.innerHTML = `${label}<span class="count">${count}</span>`;
        btn.addEventListener("click", () => {
          if (exclusive) {
            if (selected.has(label)) selected.clear();
            else {
              selected.clear();
              selected.add(label);
            }
          } else if (selected.has(label)) {
            selected.delete(label);
          } else {
            selected.add(label);
          }
          scheduleRender();
        });
        container.appendChild(btn);
      }
    }

    function matches(place) {
      return (
        matchesQuery(place) &&
        matchesStars(place) &&
        matchesRegionFilter(place) &&
        matchesCuisine(place)
      );
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function currentFilterKey() {
      const sp = state.regionPath;
      const cp = state.cuisinePath;
      return [
        state.q,
        [...state.stars].join(","),
        sp.sido || "",
        sp.city || "",
        sp.district || "",
        state.customRegion || "",
        cp.major || "",
        cp.minor || "",
        state.customCuisine || "",
      ].join("|");
    }

    function sidoOptionsHtml(selected) {
      const sel = String(selected || "").trim();
      const order = [
        "서울", "경기", "인천", "부산", "대구", "광주", "대전", "울산", "세종",
        "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주",
      ];
      return order
        .filter((s) => KNOWN_SIDOS.has(s))
        .map(
          (s) =>
            `<option value="${s}"${s === sel ? " selected" : ""}>${displaySidoLabel(s)}</option>`
        )
        .join("");
    }

    function displayRegionTagLabel(place, label) {
      const rp = place?.regionPath || emptyRegionPath();
      if (label === "광주") {
        if (rp.sido === "경기" && rp.city === "광주") return "광주시";
        if (rp.sido === "광주") return "광주광역시";
      }
      if (label === rp.sido) return displaySidoLabel(label);
      if (label === rp.city) return displayCityLabel(rp.sido, label);
      return label;
    }

    function placeCardHtml(place, isAdmin) {
      const renderTag = (t) => {
        const shown =
          t.type === "region" ? displayRegionTagLabel(place, t.label) : t.label;
        if (isAdmin && place.sid) {
          const idAttr = t.tagId ? ` data-tag-id="${escapeHtml(t.tagId)}"` : "";
          return `<span class="tag ${t.type} custom" data-type="${t.type}" data-label="${escapeHtml(t.label)}">
            <button type="button" class="tag-label" data-type="${t.type}" data-label="${escapeHtml(t.label)}">${escapeHtml(shown)}</button>
            <button type="button" class="tag-x"${idAttr}
              data-sid="${escapeHtml(String(place.sid))}"
              data-kind="${escapeHtml(t.type)}"
              data-label="${escapeHtml(t.label)}"
              title="태그 삭제" aria-label="태그 삭제">×</button>
          </span>`;
        }
        return `<button type="button" class="tag ${t.type}" data-type="${t.type}" data-label="${escapeHtml(t.label)}">${escapeHtml(shown)}</button>`;
      };

      const cuisineHtml = (place.cuisineTags || [])
        .map(renderTag)
        .join("");
      const regionHtml = (place.regionTags || [])
        .map(renderTag)
        .join("");

      const defaultMajor =
        place.cuisinePath?.major ||
        state.cuisinePath.major ||
        "한식";
      const majorSelect = Cuisine?.majorOptionsHtml?.(defaultMajor) ||
        `<option value="한식" selected>한식</option>`;
      const cuisineClear =
        isAdmin && place.sid && (place.cuisineTags || []).length
          ? `<button type="button" class="tag-clear-kind" data-sid="${escapeHtml(String(place.sid))}" data-kind="cuisine" title="종류 태그 모두 삭제">비우기</button>`
          : "";
      const cuisineAdd = isAdmin && place.sid
        ? `<form class="tag-add" data-sid="${escapeHtml(String(place.sid))}" data-kind="cuisine">
            <select name="major" aria-label="대분류" title="대분류">${majorSelect}</select>
            <input type="text" name="label" maxlength="24" placeholder="소분류" aria-label="소분류 추가" />
            <button type="submit" class="tag-add-btn" title="종류 태그 추가">+</button>
          </form>`
        : "";
      const defaultSido =
        place.regionPath?.sido ||
        state.regionPath.sido ||
        "서울";
      const regionAdd = isAdmin && place.sid
        ? `<form class="tag-add" data-sid="${escapeHtml(String(place.sid))}" data-kind="region">
            <select name="sido" aria-label="시도" title="시도">${sidoOptionsHtml(defaultSido)}</select>
            <input type="text" name="label" maxlength="24" placeholder="구/시 등" aria-label="지역 소분류 추가" />
            <button type="submit" class="tag-add-btn" title="지역 태그 추가">+</button>
          </form>`
        : "";

      const blurb = memosBySid[String(place.sid)];
      const blurbHtml = blurb
        ? `<p class="place-blurb">${escapeHtml(blurb)}</p>`
        : "";

      const starBadge =
        isAdmin && place.sid && !selectMode
          ? `<select class="stars-edit${place.stars === 0 ? " unvisited" : ""}" data-sid="${escapeHtml(String(place.sid))}" title="평점 변경" aria-label="평점 변경">
              <option value="3"${place.stars === 3 ? " selected" : ""}>★★★</option>
              <option value="2"${place.stars === 2 ? " selected" : ""}>★★</option>
              <option value="1"${place.stars === 1 ? " selected" : ""}>★</option>
              <option value="0"${place.stars === 0 ? " selected" : ""}>맛집 후보</option>
            </select>`
          : `<span class="stars${place.stars === 0 ? " unvisited" : ""}" title="${starLabel(place.stars)}">${starLabel(place.stars)}</span>`;

      return `
        <span class="place-check" aria-hidden="true"></span>
        <div class="place-head">
          <h2>${escapeHtml(place.name)}</h2>
          <div class="place-head-actions">
            ${starBadge}
            ${
              isAdmin && place.sid && !selectMode
                ? `<button type="button" class="place-delete" data-sid="${escapeHtml(String(place.sid))}" data-name="${escapeHtml(place.name)}" title="목록에서 삭제">삭제</button>`
                : ""
            }
          </div>
        </div>
        ${blurbHtml}
        <div class="tag-rows">
          <div class="tag-row">
            <div class="tag-row-label">종류</div>
            <div class="tag-row-items">${cuisineHtml}${selectMode ? "" : `${cuisineClear}${cuisineAdd}`}</div>
          </div>
          <div class="tag-row">
            <div class="tag-row-label">지역</div>
            <div class="tag-row-items">${regionHtml}${selectMode ? "" : regionAdd}</div>
          </div>
        </div>
        <a class="naver" href="${place.naverUrl}" target="_blank" rel="noopener">네이버 지도에서 보기 →</a>
      `;
    }

    function selectTagForPlace(place, type, label) {
      if (!place) return;
      if (type === "region") {
        const rp = place.regionPath || emptyRegionPath();
        if ((place.extraRegions || []).includes(label)) {
          state.customRegion = state.customRegion === label ? null : label;
          state.regionPath = emptyRegionPath();
        } else if (label === rp.sido) {
          state.customRegion = null;
          state.regionPath = { sido: rp.sido, city: null, district: null };
        } else if (label === rp.city) {
          state.customRegion = null;
          state.regionPath = { sido: rp.sido, city: rp.city, district: null };
        } else if (label === rp.district) {
          state.customRegion = null;
          state.regionPath = { sido: rp.sido, city: rp.city, district: rp.district };
        } else {
          state.customRegion = null;
          state.regionPath = emptyRegionPath();
        }
      } else {
        const cp = place.cuisinePath || emptyCuisinePath();
        if ((place.extraCuisines || []).includes(label)) {
          state.customCuisine = state.customCuisine === label ? null : label;
          state.cuisinePath = emptyCuisinePath();
        } else if (label === cp.major || isCuisineMajorLabel(label)) {
          state.customCuisine = null;
          state.cuisinePath = {
            major: state.cuisinePath.major === label && !state.cuisinePath.minor ? null : label,
            minor: null,
          };
        } else if (label === cp.minor || Cuisine?.isLeaf?.(label)) {
          state.customCuisine = null;
          const major = cp.major || Cuisine?.majorOfLeaf?.(label) || null;
          state.cuisinePath = {
            major,
            minor:
              state.cuisinePath.minor === label && state.cuisinePath.major === major
                ? null
                : label,
          };
        } else {
          state.customCuisine = label;
          state.cuisinePath = emptyCuisinePath();
        }
      }
      scheduleRender();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function isIgnorableTagError(err) {
      return /이미 있는/.test(String(err || ""));
    }

    /** 대분류 아래 소분류로 종류 태그 추가 (대분류 태그도 함께 보장) */
    async function addRegionUnderSido(sid, sidoRaw, minorRaw) {
      const sido = String(sidoRaw || "").trim();
      const minor = String(minorRaw || "").trim();
      if (!sid || !KNOWN_SIDOS.has(sido)) {
        return { error: "시도를 선택해 주세요." };
      }
      if (!minor) return { error: "구/시 등 소분류를 입력해 주세요." };

      if (KNOWN_SIDOS.has(minor)) {
        const result = await window.PlaceSocial.addTag(sid, minor, "region");
        if (result?.error && !isIgnorableTagError(result.error)) return result;
        return { ok: true };
      }

      const sidoResult = await window.PlaceSocial.addTag(sid, sido, "region");
      if (sidoResult?.error && !isIgnorableTagError(sidoResult.error)) {
        return sidoResult;
      }

      if (minor !== sido) {
        const minorResult = await window.PlaceSocial.addTag(sid, minor, "region");
        if (minorResult?.error && !isIgnorableTagError(minorResult.error)) {
          return minorResult;
        }
      }
      return { ok: true };
    }

    async function addRegionUnderSidoBulk(sids, sidoRaw, minorRaw) {
      const sido = String(sidoRaw || "").trim();
      const minor = String(minorRaw || "").trim();
      if (!KNOWN_SIDOS.has(sido)) {
        return { error: "시도를 선택해 주세요.", added: 0 };
      }
      if (!minor) return { error: "구/시 등 소분류를 입력해 주세요.", added: 0 };

      if (KNOWN_SIDOS.has(minor)) {
        return window.PlaceSocial.addTagsBulk(sids, minor, "region");
      }

      const sidoRes = await window.PlaceSocial.addTagsBulk(sids, sido, "region");
      if (sidoRes?.error) return sidoRes;
      const minorRes = await window.PlaceSocial.addTagsBulk(sids, minor, "region");
      return {
        added: minorRes?.added || 0,
        skipped: minorRes?.skipped || 0,
        error: minorRes?.error,
      };
    }

    async function addCuisineUnderMajor(sid, major, minorRaw) {
      const minor = String(minorRaw || "").trim();
      const maj = String(major || "").trim();
      if (!sid || !maj || !Cuisine?.isMajor?.(maj)) {
        return { error: "대분류를 선택해 주세요." };
      }
      if (!minor) return { error: "소분류 이름을 입력해 주세요." };

      if (Cuisine.isMajor(minor)) {
        const result = await window.PlaceSocial.addTag(sid, minor, "cuisine");
        if (result?.error && !isIgnorableTagError(result.error)) return result;
        return { ok: true };
      }

      Cuisine.registerLeaf?.(minor, maj);

      const majorResult = await window.PlaceSocial.addTag(sid, maj, "cuisine");
      if (majorResult?.error && !isIgnorableTagError(majorResult.error)) {
        return majorResult;
      }

      if (minor !== maj) {
        const minorResult = await window.PlaceSocial.addTag(sid, minor, "cuisine");
        if (minorResult?.error && !isIgnorableTagError(minorResult.error)) {
          return minorResult;
        }
      }
      return { ok: true };
    }

    async function addCuisineUnderMajorBulk(sids, major, minorRaw) {
      const minor = String(minorRaw || "").trim();
      const maj = String(major || "").trim();
      if (!maj || !Cuisine?.isMajor?.(maj)) {
        return { error: "대분류를 선택해 주세요.", added: 0 };
      }
      if (!minor) return { error: "소분류 이름을 입력해 주세요.", added: 0 };

      if (Cuisine.isMajor(minor)) {
        return window.PlaceSocial.addTagsBulk(sids, minor, "cuisine");
      }

      Cuisine.registerLeaf?.(minor, maj);
      const majorRes = await window.PlaceSocial.addTagsBulk(sids, maj, "cuisine");
      if (majorRes?.error) return majorRes;
      const minorRes = await window.PlaceSocial.addTagsBulk(sids, minor, "cuisine");
      return {
        added: (minorRes?.added || 0),
        skipped: (minorRes?.skipped || 0),
        error: minorRes?.error,
        majorAdded: majorRes?.added || 0,
      };
    }

    function wireGridOnce() {
      if (els.grid.dataset.wired) return;
      els.grid.dataset.wired = "1";

      els.grid.addEventListener("click", async (e) => {
        const card = e.target.closest?.(".place");

        if (selectMode && card?.dataset.sid) {
          const interactive = e.target.closest?.(
            "a, button, input, select, form, .tag, .tag-x, .tag-label, .tag-add"
          );
          if (!interactive) {
            e.preventDefault();
            const sid = String(card.dataset.sid);
            if (selectedSids.has(sid)) selectedSids.delete(sid);
            else selectedSids.add(sid);
            card.classList.toggle("selected", selectedSids.has(sid));
            updateBulkBar();
            return;
          }
          // In select mode, tag clicks select the card instead of filtering.
          if (e.target.closest?.("button.tag[data-label], button.tag-label[data-label], .tag.custom")) {
            if (!e.target.closest?.(".tag-x")) {
              e.preventDefault();
              e.stopPropagation();
              const sid = String(card.dataset.sid);
              if (selectedSids.has(sid)) selectedSids.delete(sid);
              else selectedSids.add(sid);
              card.classList.toggle("selected", selectedSids.has(sid));
              updateBulkBar();
              return;
            }
          }
        }

        const delBtn = e.target.closest?.(".place-delete");
        if (delBtn) {
          e.preventDefault();
          e.stopPropagation();
          const sid = delBtn.dataset.sid;
          const name = delBtn.dataset.name || "이 가게";
          if (!sid || !window.PlaceSocial?.hidePlace) return;
          if (!confirm(`「${name}」을(를) 목록에서 삭제할까요?`)) return;
          const result = await window.PlaceSocial.hidePlace(sid);
          if (result?.error) alert(result.error);
          return;
        }

        const clearKindBtn = e.target.closest?.(".tag-clear-kind");
        if (clearKindBtn) {
          e.preventDefault();
          e.stopPropagation();
          const sid = clearKindBtn.dataset.sid;
          const kind = clearKindBtn.dataset.kind === "region" ? "region" : "cuisine";
          if (!sid || !window.PlaceSocial?.clearKindTagsBulk) return;
          const kindLabel = kind === "region" ? "지역" : "종류";
          if (!confirm(`이 가게의 ${kindLabel} 태그를 모두 삭제할까요?`)) return;
          const result = await window.PlaceSocial.clearKindTagsBulk([sid], kind);
          if (result?.error) alert(result.error);
          return;
        }

        const xBtn = e.target.closest?.(".tag-x");
        if (xBtn) {
          e.preventDefault();
          e.stopPropagation();
          if (!window.PlaceSocial) return;
          const tagId = xBtn.dataset.tagId;
          const kind = xBtn.dataset.kind === "region" ? "region" : "cuisine";
          const label = xBtn.dataset.label;
          const sid = xBtn.dataset.sid;
          const place = placeBySid.get(String(sid));
          let result;
          if (tagId && window.PlaceSocial.removeTag) {
            result = await window.PlaceSocial.removeTag(tagId);
          } else if (window.PlaceSocial.removeTagByLabel) {
            const current =
              kind === "region" ? place?.region || [] : place?.cuisine || [];
            const seedLabels = current.filter(
              (l) => String(l).toLowerCase() !== String(label || "").toLowerCase()
            );
            result = await window.PlaceSocial.removeTagByLabel(sid, label, kind, {
              seedLabels,
            });
          }
          if (result?.error) alert(result.error);
          return;
        }

        const tagBtn = e.target.closest?.("button.tag[data-label], button.tag-label[data-label]");
        if (tagBtn) {
          const place = placeBySid.get(String(card?.dataset.sid || ""));
          selectTagForPlace(place, tagBtn.dataset.type, tagBtn.dataset.label);
        }
      });

      els.grid.addEventListener("submit", async (e) => {
        const form = e.target.closest?.("form.tag-add");
        if (!form || !els.grid.contains(form)) return;
        e.preventDefault();
        const input = form.querySelector('input[name="label"]');
        const label = (input?.value || "").trim();
        const kind = form.dataset.kind === "region" ? "region" : "cuisine";
        if (!label || !window.PlaceSocial?.addTag) return;

        if (kind === "cuisine") {
          const majorSel = form.querySelector('select[name="major"]');
          const major = (majorSel?.value || "").trim();
          if (!major || !Cuisine?.isMajor?.(major)) {
            alert("대분류를 선택해 주세요.");
            return;
          }
          const result = await addCuisineUnderMajor(form.dataset.sid, major, label);
          if (result?.error) {
            alert(result.error);
            return;
          }
          if (input) input.value = "";
          return;
        }

        if (kind === "region") {
          const sidoSel = form.querySelector('select[name="sido"]');
          const sido = (sidoSel?.value || "").trim();
          if (!KNOWN_SIDOS.has(sido)) {
            alert("시도를 선택해 주세요.");
            return;
          }
          const result = await addRegionUnderSido(form.dataset.sid, sido, label);
          if (result?.error) {
            alert(result.error);
            return;
          }
          if (input) input.value = "";
          return;
        }

        const result = await window.PlaceSocial.addTag(form.dataset.sid, label, kind);
        if (result?.error) {
          alert(result.error);
          return;
        }
        if (input) input.value = "";
      });

      els.grid.addEventListener("change", async (e) => {
        const sel = e.target.closest?.("select.stars-edit");
        if (!sel || !els.grid.contains(sel)) return;
        const sid = sel.dataset.sid;
        const next = Number(sel.value);
        if (!sid || !window.PlaceSocial?.setPlaceStars) return;
        sel.disabled = true;
        const result = await window.PlaceSocial.setPlaceStars(sid, next);
        sel.disabled = false;
        if (result?.error) {
          alert(result.error);
          const place = placeBySid.get(String(sid));
          if (place) sel.value = String(place.stars);
          return;
        }
      });
    }

    function updateBulkBar() {
      const isAdmin = !!window.PlaceSocial?.isAdmin?.();
      if (els.addPlaceBtn) {
        els.addPlaceBtn.hidden = !isAdmin;
      }
      if (els.selectModeBtn) {
        els.selectModeBtn.hidden = !isAdmin;
        els.selectModeBtn.classList.toggle("on", selectMode);
        els.selectModeBtn.textContent = selectMode ? "선택 중" : "선택";
      }
      if (els.selectAllBtn) {
        els.selectAllBtn.hidden = !isAdmin || !selectMode;
      }
      if (els.selectVisibleBtn) {
        els.selectVisibleBtn.hidden = !isAdmin || !selectMode;
      }
      if (els.bulkBar) {
        els.bulkBar.hidden = !isAdmin || !selectMode;
      }
      if (els.bulkCount) {
        els.bulkCount.textContent = `${selectedSids.size}곳 선택`;
      }
      if (els.bulkAddBtn) {
        els.bulkAddBtn.disabled = selectedSids.size === 0;
      }
      if (els.bulkRemoveBtn) {
        els.bulkRemoveBtn.disabled = selectedSids.size === 0;
      }
      if (els.bulkWipeBtn) {
        els.bulkWipeBtn.disabled = selectedSids.size === 0;
      }
      els.grid.classList.toggle("select-mode", selectMode && isAdmin);
    }

    function setSelectMode(on) {
      selectMode = !!on;
      if (!selectMode) selectedSids.clear();
      updateBulkBar();
      scheduleRender();
    }

    function renderPlaces(list) {
      const isAdmin = !!window.PlaceSocial?.isAdmin?.();
      wireGridOnce();
      lastShownPlaces = list;
      els.grid.classList.toggle("anim", list.length <= PAGE_SIZE);
      els.grid.classList.toggle("select-mode", selectMode && isAdmin);
      const frag = document.createDocumentFragment();
      for (const place of list) {
        const article = document.createElement("article");
        article.className = "place";
        if (place.sid) {
          article.dataset.sid = String(place.sid);
          if (selectedSids.has(String(place.sid))) article.classList.add("selected");
        }
        article.innerHTML = placeCardHtml(place, isAdmin);
        frag.appendChild(article);
      }
      els.grid.replaceChildren(frag);
      updateBulkBar();
    }

    function renderActiveFilters() {
      if (!els.activeFilters) return;
      const frag = document.createDocumentFragment();
      const add = (label, className) => {
        const span = document.createElement("span");
        span.className = "active-filter" + (className ? ` ${className}` : "");
        span.textContent = label;
        frag.appendChild(span);
      };

      const q = (state.q || "").trim();
      if (q) add(`“${q}”`, "query");

      for (const star of state.stars) {
        add(star, star === "맛집 후보" ? "star unvisited" : "star");
      }

      if (state.customRegion) {
        add(state.customRegion, "region");
      } else {
        const { sido, city, district } = state.regionPath;
        if (sido) add(displaySidoLabel(sido), "region");
        if (city) add(displayCityLabel(sido, city), "region");
        if (district) add(district, "region");
      }

      if (state.customCuisine) {
        add(state.customCuisine, "cuisine");
      } else {
        const { major, minor } = state.cuisinePath;
        for (const label of [major, minor].filter(Boolean)) {
          add(label, "cuisine");
        }
      }

      els.activeFilters.replaceChildren(frag);
    }

    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        render();
      });
    }

    function render() {
      const nextKey = currentFilterKey();
      if (nextKey !== filterKey) {
        filterKey = nextKey;
        visibleLimit = PAGE_SIZE;
      }

      renderChips(els.starChips, starChipStats(), state.stars, { exclusive: true });
      renderRegionChips();
      renderCuisineChips();
      renderActiveFilters();

      const filtered = places.filter(matches);
      lastFilteredPlaces = filtered;
      const shown = filtered.slice(0, visibleLimit);

      els.totalCount.textContent = String(places.length);
      els.star1Count.textContent = String(starStats.find(([k]) => k === "★")?.[1] || 0);
      els.star2Count.textContent = String(starStats.find(([k]) => k === "★★")?.[1] || 0);
      els.star3Count.textContent = String(starStats.find(([k]) => k === "★★★")?.[1] || 0);
      if (els.star0Count) {
        els.star0Count.textContent = String(starStats.find(([k]) => k === "맛집 후보")?.[1] || 0);
      }
      els.shownCount.textContent = String(filtered.length);
      els.empty.hidden = filtered.length > 0;
      hasMore = filtered.length > shown.length;
      if (els.scrollSentinel) {
        els.scrollSentinel.hidden = !hasMore;
      }
      renderPlaces(shown);
    }

    let searchTimer = 0;
    els.q.addEventListener("input", () => {
      state.q = els.q.value.trim();
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(() => scheduleRender(), 160);
    });

    function goHome() {
      state.q = "";
      state.stars.clear();
      state.regionPath = emptyRegionPath();
      state.customRegion = null;
      state.cuisinePath = emptyCuisinePath();
      state.customCuisine = null;
      if (els.q) els.q.value = "";
      if (selectMode) setSelectMode(false);
      else scheduleRender();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setAddPlaceStatus(msg, isError = false) {
      if (!els.addPlaceStatus) return;
      els.addPlaceStatus.textContent = msg || "";
      els.addPlaceStatus.classList.toggle("error", !!isError);
    }

    function resetAddPlaceModal() {
      if (els.addPlaceUrl) els.addPlaceUrl.value = "";
      if (els.addPlacePreview) els.addPlacePreview.hidden = true;
      if (els.addPlaceName) els.addPlaceName.value = "";
      if (els.addPlaceAddress) els.addPlaceAddress.value = "";
      if (els.addPlaceCategory) els.addPlaceCategory.value = "";
      if (els.addPlaceStars) els.addPlaceStars.value = "0";
      if (els.addPlaceSid) els.addPlaceSid.value = "";
      if (els.addPlacePx) els.addPlacePx.value = "";
      if (els.addPlacePy) els.addPlacePy.value = "";
      if (els.addPlaceSourceUrl) els.addPlaceSourceUrl.value = "";
      setAddPlaceStatus("");
    }

    function openAddPlaceModal() {
      if (!els.addPlaceModal || !window.PlaceSocial?.isAdmin?.()) return;
      resetAddPlaceModal();
      els.addPlaceModal.showModal();
      els.addPlaceUrl?.focus();
    }

    els.addPlaceBtn?.addEventListener("click", () => {
      openAddPlaceModal();
    });

    els.addPlaceResolveBtn?.addEventListener("click", async () => {
      if (!window.PlaceSocial?.resolveNaverPlace) return;
      const url = (els.addPlaceUrl?.value || "").trim();
      if (!url) {
        setAddPlaceStatus("네이버 지도 링크를 입력해 주세요.", true);
        els.addPlaceUrl?.focus();
        return;
      }
      els.addPlaceResolveBtn.disabled = true;
      setAddPlaceStatus("불러오는 중…");
      const result = await window.PlaceSocial.resolveNaverPlace(url);
      els.addPlaceResolveBtn.disabled = false;
      if (result?.error) {
        setAddPlaceStatus(result.error, true);
        return;
      }
      const sid = String(result.sid || "");
      if (sid && placeBySid.has(sid)) {
        setAddPlaceStatus(`이미 목록에 있는 가게입니다. (sid ${sid})`, true);
      } else if (result.partial) {
        setAddPlaceStatus("일부만 불러왔습니다. 이름·주소를 확인해 주세요.");
      } else {
        setAddPlaceStatus("불러오기 완료. 확인 후 추가하세요.");
      }
      if (els.addPlacePreview) els.addPlacePreview.hidden = false;
      if (els.addPlaceSid) els.addPlaceSid.value = sid;
      if (els.addPlaceName) els.addPlaceName.value = result.name || "";
      if (els.addPlaceAddress) els.addPlaceAddress.value = result.address || "";
      if (els.addPlaceCategory) els.addPlaceCategory.value = result.category || "";
      if (els.addPlacePx) els.addPlacePx.value = result.px == null ? "" : String(result.px);
      if (els.addPlacePy) els.addPlacePy.value = result.py == null ? "" : String(result.py);
      if (els.addPlaceSourceUrl) els.addPlaceSourceUrl.value = result.source_url || url;
      if (els.addPlaceStars) els.addPlaceStars.value = "0";
      els.addPlaceName?.focus();
    });

    els.addPlaceSaveBtn?.addEventListener("click", async () => {
      if (!window.PlaceSocial?.addPlace) return;
      const sid = (els.addPlaceSid?.value || "").trim();
      const name = (els.addPlaceName?.value || "").trim();
      const address = (els.addPlaceAddress?.value || "").trim();
      const category = (els.addPlaceCategory?.value || "").trim();
      const stars = Number(els.addPlaceStars?.value || 0);
      if (!sid) {
        setAddPlaceStatus("먼저 링크에서 정보를 불러와 주세요.", true);
        return;
      }
      if (!name) {
        setAddPlaceStatus("가게 이름을 입력해 주세요.", true);
        els.addPlaceName?.focus();
        return;
      }
      if (placeBySid.has(sid) && !addedPlaceRows.some((r) => String(r.sid) === sid)) {
        setAddPlaceStatus("이미 기본 목록에 있는 가게입니다.", true);
        return;
      }
      els.addPlaceSaveBtn.disabled = true;
      setAddPlaceStatus("저장 중…");
      const pxRaw = els.addPlacePx?.value;
      const pyRaw = els.addPlacePy?.value;
      const result = await window.PlaceSocial.addPlace({
        sid,
        name,
        address,
        category,
        stars,
        px: pxRaw === "" || pxRaw == null ? null : Number(pxRaw),
        py: pyRaw === "" || pyRaw == null ? null : Number(pyRaw),
        source_url: els.addPlaceSourceUrl?.value || null,
      });
      els.addPlaceSaveBtn.disabled = false;
      if (result?.error) {
        setAddPlaceStatus(result.error, true);
        return;
      }

      // Seed tags for the new place when possible
      const place = placeBySid.get(sid);
      if (place && window.PlaceSocial.seedRegionTags && window.PlaceSocial.seedCuisineTags) {
        await window.PlaceSocial.seedRegionTags([
          { sid, labels: place.addressRegionLabels || [] },
        ]);
        await window.PlaceSocial.seedCuisineTags([
          { sid, labels: place.baseCuisine || [] },
        ]);
      }

      setAddPlaceStatus("추가되었습니다.");
      els.addPlaceModal?.close();
      resetAddPlaceModal();
      filterKey = "";
      scheduleRender();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    els.addPlaceUrl?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        els.addPlaceResolveBtn?.click();
      }
    });

    els.homeBtn?.addEventListener("click", goHome);

    els.resetBtn.addEventListener("click", () => {
      goHome();
    });

    els.selectModeBtn?.addEventListener("click", () => {
      if (!window.PlaceSocial?.isAdmin?.()) return;
      setSelectMode(!selectMode);
    });

    els.selectAllBtn?.addEventListener("click", () => {
      if (!selectMode) return;
      for (const place of lastFilteredPlaces) {
        if (place.sid) selectedSids.add(String(place.sid));
      }
      scheduleRender();
    });

    els.selectVisibleBtn?.addEventListener("click", () => {
      if (!selectMode) return;
      for (const place of lastShownPlaces) {
        if (place.sid) selectedSids.add(String(place.sid));
      }
      scheduleRender();
    });

    els.bulkKind?.addEventListener("click", (e) => {
      const btn = e.target.closest?.("button[data-kind]");
      if (!btn) return;
      bulkKind = btn.dataset.kind === "region" ? "region" : "cuisine";
      els.bulkKind.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("on", b.dataset.kind === bulkKind);
      });
      if (els.bulkCuisineMajor) {
        els.bulkCuisineMajor.hidden = bulkKind !== "cuisine";
      }
      if (els.bulkRegionSido) {
        els.bulkRegionSido.hidden = bulkKind !== "region";
      }
      if (els.bulkLabel) {
        els.bulkLabel.placeholder =
          bulkKind === "cuisine" ? "소분류 이름" : "구/시 등";
      }
    });

    if (els.bulkCuisineMajor) {
      els.bulkCuisineMajor.hidden = bulkKind !== "cuisine";
    }
    if (els.bulkRegionSido) {
      els.bulkRegionSido.hidden = bulkKind !== "region";
    }

    els.bulkClearBtn?.addEventListener("click", () => {
      selectedSids.clear();
      scheduleRender();
    });

    els.bulkExitBtn?.addEventListener("click", () => {
      setSelectMode(false);
    });

    els.bulkRemoveBtn?.addEventListener("click", async () => {
      if (!window.PlaceSocial?.removeTagsBulk) return;
      const label = (els.bulkLabel?.value || "").trim();
      if (!label) {
        alert(
          bulkKind === "cuisine"
            ? "삭제할 종류 태그 이름을 입력해 주세요. (예: 바)"
            : "삭제할 지역 태그 이름을 입력해 주세요."
        );
        els.bulkLabel?.focus();
        return;
      }
      if (!selectedSids.size) {
        alert("가게를 먼저 선택해 주세요.");
        return;
      }
      const kindLabel = bulkKind === "cuisine" ? "종류" : "지역";
      if (
        !confirm(
          `선택한 ${selectedSids.size}곳에서 ${kindLabel} 태그 「${label}」을(를) 삭제할까요?`
        )
      ) {
        return;
      }
      els.bulkRemoveBtn.disabled = true;
      const result = await window.PlaceSocial.removeTagsBulk(
        [...selectedSids],
        label,
        bulkKind
      );
      els.bulkRemoveBtn.disabled = selectedSids.size === 0;
      if (result?.error) {
        alert(result.error);
        return;
      }
      alert(`${result?.removed || 0}곳에서 「${label}」 태그를 삭제했습니다.`);
      if (els.bulkLabel) els.bulkLabel.value = "";
    });

    els.bulkWipeBtn?.addEventListener("click", async () => {
      if (!window.PlaceSocial?.clearKindTagsBulk) return;
      if (!selectedSids.size) {
        alert("가게를 먼저 선택해 주세요.");
        return;
      }
      const kindLabel = bulkKind === "cuisine" ? "종류" : "지역";
      if (
        !confirm(
          `선택한 ${selectedSids.size}곳의 ${kindLabel} 태그를 모두 삭제할까요?`
        )
      ) {
        return;
      }
      els.bulkWipeBtn.disabled = true;
      const result = await window.PlaceSocial.clearKindTagsBulk(
        [...selectedSids],
        bulkKind
      );
      els.bulkWipeBtn.disabled = selectedSids.size === 0;
      if (result?.error) {
        alert(result.error);
        return;
      }
      alert(`${result?.cleared || 0}곳의 ${kindLabel} 태그를 비웠습니다.`);
    });

    els.bulkAddBtn?.addEventListener("click", async () => {
      if (!window.PlaceSocial?.addTagsBulk) return;
      const label = (els.bulkLabel?.value || "").trim();
      if (!label) {
        alert(bulkKind === "cuisine" ? "소분류 이름을 입력해 주세요." : "구/시 등 소분류를 입력해 주세요.");
        els.bulkLabel?.focus();
        return;
      }
      if (!selectedSids.size) {
        alert("가게를 먼저 선택해 주세요.");
        return;
      }

      if (bulkKind === "cuisine") {
        const major = (els.bulkCuisineMajor?.value || "").trim();
        const preview = `${major} › ${label}`;
        if (!confirm(`선택한 ${selectedSids.size}곳에 종류 태그 「${preview}」을(를) 추가할까요?`)) {
          return;
        }
        els.bulkAddBtn.disabled = true;
        const result = await addCuisineUnderMajorBulk([...selectedSids], major, label);
        els.bulkAddBtn.disabled = selectedSids.size === 0;
        if (result?.error) {
          alert(result.error);
          return;
        }
        const added = result?.added || 0;
        const skipped = result?.skipped || 0;
        if (els.bulkLabel) els.bulkLabel.value = "";
        alert(`추가 ${added}곳` + (skipped ? `, 이미 있음 ${skipped}곳` : ""));
        return;
      }

      const sido = (els.bulkRegionSido?.value || "").trim();
      const preview = `${sido} › ${label}`;
      if (!confirm(`선택한 ${selectedSids.size}곳에 지역 태그 「${preview}」을(를) 추가할까요?`)) {
        return;
      }
      els.bulkAddBtn.disabled = true;
      const result = await addRegionUnderSidoBulk([...selectedSids], sido, label);
      els.bulkAddBtn.disabled = selectedSids.size === 0;
      if (result?.error) {
        alert(result.error);
        return;
      }
      const added = result?.added || 0;
      const skipped = result?.skipped || 0;
      if (els.bulkLabel) els.bulkLabel.value = "";
      alert(`추가 ${added}곳` + (skipped ? `, 이미 있음 ${skipped}곳` : ""));
    });

    els.bulkLabel?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        els.bulkAddBtn?.click();
      }
    });

    if (els.scrollSentinel && "IntersectionObserver" in window) {
      const io = new IntersectionObserver(
        (entries) => {
          if (!entries.some((e) => e.isIntersecting)) return;
          if (!hasMore) return;
          visibleLimit += PAGE_SIZE;
          scheduleRender();
        },
        { root: null, rootMargin: "600px 0px", threshold: 0 }
      );
      io.observe(els.scrollSentinel);
    } else {
      window.addEventListener(
        "scroll",
        () => {
          if (!hasMore) return;
          const nearBottom =
            window.innerHeight + window.scrollY >= document.body.offsetHeight - 800;
          if (!nearBottom) return;
          visibleLimit += PAGE_SIZE;
          scheduleRender();
        },
        { passive: true }
      );
    }

    render();
    let tagSeedStarted = false;
    window.PlaceSocial?.init({
      onMemosChange(map) {
        memosBySid = map || {};
        scheduleRender();
      },
      onTagsChange(map) {
        tagsBySid = map || {};
        applyCustomTags();
        scheduleRender();
      },
      onHiddenChange(sids) {
        applyHiddenPlaces(sids);
        applyCustomTags();
        filterKey = "";
        scheduleRender();
      },
      onStarsChange(map) {
        applyStarOverrides(map);
        filterKey = "";
        scheduleRender();
      },
      onAddedPlacesChange(rows) {
        applyAddedPlaces(rows);
        filterKey = "";
        scheduleRender();
      },
      async onAuthChange(auth) {
        if (!auth?.isAdmin && selectMode) {
          selectMode = false;
          selectedSids.clear();
        }
        updateBulkBar();
        scheduleRender();
        if (!auth?.isAdmin || tagSeedStarted) return;
        if (!window.PlaceSocial?.seedRegionTags || !window.PlaceSocial?.seedCuisineTags) return;
        tagSeedStarted = true;

        const cuisineLabelSet = Cuisine?.allCuisineLabels?.() || [];

        if (window.PlaceSocial.repairTagKinds) {
          const repaired = await window.PlaceSocial.repairTagKinds({
            cuisineLabels: cuisineLabelSet,
            regionLabels: [...KNOWN_SIDOS],
          });
          if (repaired?.fixed) {
            console.info(`[tags] repaired ${repaired.fixed} misclassified tags`);
          }
        }

        const regionEntries = places
          .filter((p) => p.sid)
          .map((p) => ({
            sid: p.sid,
            labels: p.addressRegionLabels || [],
          }));
        const cuisineEntries = places
          .filter((p) => p.sid)
          .map((p) => ({
            sid: p.sid,
            labels: p.baseCuisine || [],
          }));

        const regionResult = await window.PlaceSocial.seedRegionTags(regionEntries);
        const cuisineResult = await window.PlaceSocial.seedCuisineTags(cuisineEntries);

        if (regionResult?.error || cuisineResult?.error) {
          console.warn("[tags] seed failed", regionResult?.error || cuisineResult?.error);
          tagSeedStarted = false;
          return;
        }
        regionDbReady = true;
        cuisineDbReady = true;
        applyCustomTags();
        scheduleRender();
        if (regionResult?.seeded) {
          console.info(`[tags] seeded ${regionResult.seeded} region tags`);
        }
        if (cuisineResult?.seeded) {
          console.info(`[tags] seeded ${cuisineResult.seeded} cuisine tags`);
        }
      },
    });
